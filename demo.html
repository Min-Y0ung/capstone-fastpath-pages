<style>
/* 레이아웃: 왼쪽 시나리오 목록 + 오른쪽 모니터(파형 → 토큰 → 판정 2열). 현장 안전 모니터 계기판 느낌 */
:root {
  --bg: #f3f5f1; --panel: #ffffff; --ink: #1d2a22; --muted: #5d6b62; --line: #d9e0d8; --soft: #e9eee7;
  --accent: #2f6b4a; --accent-soft: #dcebe1;
  --acc: #2f6b4a; --gyro: #8a5a1c; --hr: #b23a48; --win: rgba(47,107,74,.08);
  --ok: #2f7d4f; --caution: #b7811a; --danger: #cc5a1e; --emergency: #b3261e;
  --ok-bg: #e2f1e7; --bad-bg: #f8e3df;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --panel: #1a221d; --ink: #e3ebe5; --muted: #93a399; --line: #2c3830; --soft: #222c26;
  --accent: #7cc49a; --accent-soft: #24382c;
  --acc: #7cc49a; --gyro: #e0a85a; --hr: #f07a88; --win: rgba(124,196,154,.09);
  --ok: #6fcf93; --caution: #e8b04a; --danger: #f08a4b; --emergency: #ff6b5e;
  --ok-bg: #1f3a29; --bad-bg: #42231f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --panel: #1a221d; --ink: #e3ebe5; --muted: #93a399; --line: #2c3830; --soft: #222c26;
  --accent: #7cc49a; --accent-soft: #24382c;
  --acc: #7cc49a; --gyro: #e0a85a; --hr: #f07a88; --win: rgba(124,196,154,.09);
  --ok: #6fcf93; --caution: #e8b04a; --danger: #f08a4b; --emergency: #ff6b5e;
  --ok-bg: #1f3a29; --bad-bg: #42231f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px }
h1 { font-size: 1.55rem; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 62ch }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: .82rem }
.steps li { padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); transition: background .2s, color .2s }
.steps li.on { background: var(--accent); color: var(--panel) }
.steps li.done { background: var(--accent-soft); color: var(--accent) }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr) } }

nav { display: grid; gap: 14px }
nav h2 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600 }
nav .group { display: grid; gap: 4px }
@media (max-width: 820px) { nav { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) } }
.scene { all: unset; cursor: pointer; display: grid; gap: 1px; padding: 8px 12px; border-radius: 8px; border: 1px solid transparent }
.scene:hover { background: var(--soft) }
.scene:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.scene[aria-current="true"] { background: var(--panel); border-color: var(--line) }
.scene b { font-weight: 600; font-size: .92rem }
.scene span { font-size: .78rem; color: var(--muted) }

main { display: grid; gap: 16px; min-width: 0 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0 }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; margin-bottom: 10px }
.panel h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600 }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums }
.meta strong { color: var(--ink); font-weight: 600 }
.btn { all: unset; cursor: pointer; font-size: .82rem; font-weight: 600; padding: 5px 12px; border-radius: 6px; background: var(--accent); color: var(--panel) }
.btn.ghost { background: var(--soft); color: var(--ink) }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.scene-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px }
.scene-title h2 { margin: 0; font-size: 1.2rem }
.truth { font-size: .8rem; padding: 2px 8px; border-radius: 4px; background: var(--soft); color: var(--muted) }
.truth b { color: var(--ink) }

.chart-box { position: relative }
canvas { display: block; width: 100%; height: 260px }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .78rem; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px }

pre.tokens { margin: 0; font-family: var(--mono); font-size: .76rem; line-height: 1.7; white-space: pre-wrap; word-break: break-all;
  background: var(--soft); border-radius: 8px; padding: 12px 14px; min-height: 9.5em }
.tk-tag { color: var(--accent); font-weight: 500 }
.tk-lvl { color: var(--danger); font-weight: 500 }
.tk-line { opacity: 0; transition: opacity .25s }
.tk-line.show { opacity: 1 }

.verdicts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 640px) { .verdicts { grid-template-columns: minmax(0, 1fr) } }
.card { display: grid; gap: 12px; align-content: start }
.card.llm { border-color: var(--accent); border-width: 2px }
.who { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.who h3 { color: var(--ink) }
.mark { font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 4px }
.mark.ok { background: var(--ok-bg); color: var(--ok) }
.mark.bad { background: var(--bad-bg); color: var(--emergency) }
.type { font-size: 1.45rem; font-weight: 700; line-height: 1.2 }
.type small { display: block; font-size: .8rem; font-weight: 500; color: var(--muted) }
.gauge { display: grid; gap: 4px }
.bar { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg,
  var(--ok) 0 40%, var(--caution) 40% 70%, var(--danger) 70% 90%, var(--emergency) 90% 100%); opacity: .9 }
.pin { position: absolute; top: -5px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--ink); transition: left .5s ease-out }
.gauge-row { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums }
.gauge-row b { font-size: 1rem; color: var(--ink) }
.lvl { font-weight: 700 }
ul.actions { margin: 0; padding-left: 1.1em; display: grid; gap: 2px; font-size: .88rem }
.why { font-size: .86rem; color: var(--ink); background: var(--soft); border-radius: 8px; padding: 10px 12px; margin: 0 }
.why-label { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px }
.lat { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums }
.waiting { display: grid; place-items: center; min-height: 180px; color: var(--muted); font-size: .9rem; text-align: center; gap: 6px }
.waiting .clock { font-family: var(--mono); font-size: 1.6rem; color: var(--ink); font-variant-numeric: tabular-nums }
.dots::after { content: "…"; animation: blink 1s steps(2) infinite }
@keyframes blink { 50% { opacity: .2 } }

footer { font-size: .78rem; color: var(--muted); max-width: 90ch }
@media (prefers-reduced-motion: reduce) { .pin, .tk-line, .steps li { transition: none } .dots::after { animation: none } }
</style>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const NAMES = { none: "정상", fall: "낙상", slip_trip: "전도", entrapment: "끼임", heat_illness: "온열질환", cardiac: "급성 심박 이상" };
const LEVELS = [[40, "정상", "--ok"], [70, "주의", "--caution"], [90, "위험", "--danger"], [100, "긴급", "--emergency"]];
const GROUPS = [["사고", s => s.label !== "none" && s.case !== "llm_miss"],
                ["정상 작업 (규칙이 오탐하는 경우)", s => s.label === "none" && s.source !== "pamap2"],
                ["실측 정상 활동 (PAMAP2)", s => s.source === "pamap2"],
                ["한계", s => s.case === "llm_miss"]];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let cur = 0, run = 0;   // run: 재생 세대 번호 (시나리오를 바꾸면 이전 타이머 무효)

function level(u) { return LEVELS.find(([hi]) => u <= hi); }

function buildNav() {
  const nav = $("nav");
  GROUPS.forEach(([name, test]) => {
    const g = document.createElement("div"); g.className = "group";
    g.innerHTML = `<h2>${name}</h2>`;
    D.scenes.forEach((s, i) => {
      if (!test(s)) return;
      const b = document.createElement("button");
      b.className = "scene"; b.type = "button"; b.dataset.i = i;
      b.innerHTML = `<b>${esc(s.title)}</b><span>${esc(s.desc)}</span>`;
      b.onclick = () => select(i, true);
      g.appendChild(b);
    });
    nav.appendChild(g);
  });
}

function setStep(n) {   // n: 진행 중인 단계 (0~3), 4 = 모두 완료
  [...$("steps").children].forEach((li, i) => { li.className = i < n ? "done" : i === n ? "on" : ""; });
}

function drawChart(s, upto) {   // upto: 0~1, 그릴 비율
  const c = $("chart"), dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const sg = s.signals, n = sg.acc_g.length, total = sg.pre_s + sg.win_s;
  const L = 44, R = 10, lane = (H - 22) / 3, x = i => L + (W - L - R) * i / (n - 1);
  g.font = `11px ${css("--mono") || "monospace"}`;
  // 판정 윈도우 음영
  const wx = L + (W - L - R) * sg.pre_s / total;
  g.fillStyle = css("--win"); g.fillRect(wx, 0, W - R - wx, H - 22);
  g.strokeStyle = css("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(wx, 0); g.lineTo(wx, H - 22); g.stroke();
  // 시간축
  g.fillStyle = css("--muted"); g.textAlign = "center";
  for (let t = 0; t <= total; t += 1) {
    const tx = L + (W - L - R) * t / total;
    g.fillText(t === total ? `${t - sg.pre_s}s` : String(t - sg.pre_s), tx, H - 6);
  }
  const lanes = [
    ["acc_g", "--acc", Math.max(3, ...sg.acc_g) * 1.1, 0, "g"],
    ["gyro_dps", "--gyro", Math.max(200, ...sg.gyro_dps) * 1.1, 0, "°/s"],
    ["hr", "--hr", null, null, "bpm"],
  ];
  const hrv = sg.hr.filter(v => v != null);
  if (hrv.length) { lanes[2][2] = Math.max(...hrv) + 8; lanes[2][3] = Math.min(...hrv) - 8; }
  const m = Math.max(1, Math.round(upto * (n - 1)));
  lanes.forEach(([key, color, hi, lo, unit], k) => {
    const top = k * lane + 6, h = lane - 12, arr = sg[key];
    g.strokeStyle = css("--line"); g.beginPath(); g.moveTo(L, top + h); g.lineTo(W - R, top + h); g.stroke();
    g.fillStyle = css("--muted"); g.textAlign = "right";
    if (hi == null) { g.fillText("심박 없음", L - 6, top + h / 2 + 4); return; }
    g.fillText(hi >= 100 ? Math.round(hi) : hi.toFixed(1), L - 6, top + 9);
    g.fillText(unit, L - 6, top + h);
    g.strokeStyle = css(color); g.lineWidth = 1.6; g.lineJoin = "round"; g.beginPath();
    let pen = false;
    for (let i = 0; i <= m && i < n; i++) {
      if (arr[i] == null) { pen = false; continue; }
      const y = top + h - h * (arr[i] - lo) / (hi - lo);
      pen ? g.lineTo(x(i), y) : g.moveTo(x(i), y); pen = true;
    }
    g.stroke();
  });
  if (upto < 1) {   // 재생 위치
    g.strokeStyle = css("--ink"); g.lineWidth = 1; g.beginPath(); g.moveTo(x(m), 0); g.lineTo(x(m), H - 22); g.stroke();
  }
}

function renderTokens(s, show) {
  $("tokens").innerHTML = s.tokens.split("\n").map(line => {
    let h = esc(line).replace(/&lt;\/?[A-Z]+&gt;|\[fptok-[\d.]+\]/g, t => `<span class="tk-tag">${t}</span>`)
      .replace(/=(SEVERE|STRONG|VERY_FAST|LONG|HIGH|VERY_HIGH|DANGER|WARNING|ELEVATED|LOW|STILL)\b/g, '=<span class="tk-lvl">$1</span>');
    return `<span class="tk-line${show ? " show" : ""}">${h}</span>`;
  }).join("\n");
}

function verdictHTML(kind, s, v, ms) {
  const ok = v.accident_type === s.label;
  const [, lname, lvar] = level(v.urgency_score);
  const head = kind === "llm"

    <div class="type">${NAMES[v.accident_type]}<small>${v.accident_detected ? "사고 감지" : "사고 아님"}</small></div>
    <div class="gauge"><div class="bar"><span class="pin" style="left:${v.urgency_score}%"></span></div>
      <div class="gauge-row"><span>긴급도 <b>${v.urgency_score}</b> / 100</span><span class="lvl" style="color:var(${lvar})">${lname}</span></div></div>
    <div><span class="why-label">권고 조치</span><ul class="actions">${v.recommended_actions.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
    <p class="why"><span class="why-label">판단 근거</span>${esc(v.rationale)}</p>
    <span class="lat">${ms}</span>`;
}

function waitingHTML(title) {
  return `<div class="who"><h3>${title}</h3></div><div class="waiting"><span class="clock" id="clock">0 ms</span><span class="dots">LLM 응답 대기</span></div>`;
}

function renderMeta(s) {
  const w = s.weather;
  $("s-title").textContent = s.title;
  $("s-truth").innerHTML = `정답 <b>${NAMES[s.label]}</b>`;
  $("s-meta").innerHTML = `<span>${esc(s.desc)}</span><span>기온 <strong>${w.temp_c}°C</strong> · 습도 <strong>${w.humidity}%</strong> · 풍속 <strong>${w.wind_ms}m/s</strong></span><span>기상: 기상청 ASOS 전주 ${esc((w.source || "").replace("asos:", ""))}</span>`;
}

function showFinal(s) {
  drawChart(s, 1); renderTokens(s, true); setStep(4);
  $("th-card").innerHTML = verdictHTML("th", s, s.threshold.verdict, "판정 1ms 미만 (규칙 계산)");
  $("llm-card").innerHTML = verdictHTML("llm", s, s.llm.verdict, `LLM 응답 ${s.llm.llm_ms.toLocaleString()}ms · 종단 ${s.llm.e2e_ms.toLocaleString()}ms (목표 3,000ms)`);
}

function select(i, animate) {
  cur = i; const s = D.scenes[i], my = ++run;
  document.querySelectorAll(".scene").forEach(b => b.setAttribute("aria-current", String(+b.dataset.i === i)));
  renderMeta(s);
  if (!animate || reduce) return showFinal(s);
  const alive = () => my === run;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    setStep(0); renderTokens(s, false);
    $("th-card").innerHTML = `<div class="who"><h3>임계값 규칙 (비교 기준)</h3></div><div class="waiting">센서 수집 중</div>`;
    $("llm-card").innerHTML = `<div class="who"><h3>LLM 판정 · ${esc(s.llm.model)}</h3></div><div class="waiting">센서 수집 중</div>`;
    const dur = 5000, t0 = performance.now();   // 10초 신호를 2배속으로
    await new Promise(done => {
      const tick = now => {
        if (!alive()) return done();
        const p = Math.min(1, (now - t0) / dur); drawChart(s, p);
        p < 1 ? requestAnimationFrame(tick) : done();
      };
      requestAnimationFrame(tick);
    });
    if (!alive()) return;
    setStep(1);
    const lines = $("tokens").children;
    for (const ln of lines) { await sleep(180); if (!alive()) return; ln.classList.add("show"); }
    await sleep(250); if (!alive()) return;
    setStep(2);
    $("th-card").innerHTML = verdictHTML("th", s, s.threshold.verdict, "판정 1ms 미만 (규칙 계산)");
    $("llm-card").innerHTML = waitingHTML(`LLM 판정 · ${esc(s.llm.model)}`);
    const c0 = performance.now(), wait = s.llm.llm_ms;   // 기록된 실제 응답 시간만큼 기다린다
    await new Promise(done => {
      const tick = now => {
        if (!alive()) return done();
        const e = Math.min(wait, now - c0), el = $("clock");
        if (el) el.textContent = `${Math.round(e).toLocaleString()} ms`;
        e < wait ? requestAnimationFrame(tick) : done();
      };
      requestAnimationFrame(tick);
    });
    if (!alive()) return;
    setStep(3);
    $("llm-card").innerHTML = verdictHTML("llm", s, s.llm.verdict, `LLM 응답 ${s.llm.llm_ms.toLocaleString()}ms · 종단 ${s.llm.e2e_ms.toLocaleString()}ms (목표 3,000ms)`);
    await sleep(600); if (alive()) setStep(4);
  })();
}

$("play").onclick = () => select(cur, true);
$("skip").onclick = () => { run++; showFinal(D.scenes[cur]); };
addEventListener("resize", () => drawChart(D.scenes[cur], 1));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawChart(D.scenes[cur], 1));
new MutationObserver(() => drawChart(D.scenes[cur], 1)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

$("foot").innerHTML = `화면의 판정은 평가(test 세트) 중 로컬 GPU(RTX 5070)에서 실행한 파인튜닝 모델 <code>${esc(D.scenes[0].llm.model)}</code>(Qwen3.5 4B)이 실제로 반환한 응답을 기록해 재생한 것입니다. 시연 중에는 모델을 호출하지 않으며, 대기 시간은 기록된 실제 응답 시간입니다. 사고·정상 작업 시나리오의 센서 신호는 SisFall 실측으로 보정한 합성 데이터이고, ‘실측 정상 활동’은 PAMAP2 공개 데이터의 실제 착용 기록입니다. 기상값은 기상청 ASOS 실측 관측값입니다.`;
buildNav();
select(0, false);
</script>

</body>
</html>
